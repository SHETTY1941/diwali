<!DOCTYPE html>
<html lang="en">
<!--
  ✏️  TO CHANGE THE NAME:
  Search for  "CHANGE NAME HERE"  in the <script> near the bottom
  and edit the text inside the quotes.

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040d">
<title>Happy Diwali – Har Har Mahadev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Great+Vibes&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03040d; --ink:#f6efe0; --muted:#d4c8de; --gold:#ffd27a;
  --glass:rgba(16,12,38,.55); --line:rgba(255,210,122,.38);
  --sw:min(80vw,54vh);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#03040d; --ink:#f6efe0; --muted:#d4c8de; --glass:rgba(16,12,38,.55); --line:rgba(255,210,122,.38); } }
:root[data-theme="dark"]{ --bg:#03040d; --ink:#f6efe0; --muted:#d4c8de; --glass:rgba(16,12,38,.55); --line:rgba(255,210,122,.38); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0} #fx{z-index:2} #sn{z-index:3}

.gt{display:inline-block;padding:0 .18em;background:linear-gradient(180deg,#fff8e3 0%,#ffd27a 52%,#e09a35 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 .35em rgba(255,186,90,.45))}
.shine{background:linear-gradient(100deg,#e09a35 0%,#fff6dc 25%,#ffd27a 50%,#fff6dc 75%,#e09a35 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 4.5s linear infinite;filter:drop-shadow(0 0 .4em rgba(255,186,90,.5))}
@keyframes shine{to{background-position:-200% 0}}

/* ---------- Mahadev ---------- */
#shrine{position:absolute;left:50%;top:42%;width:var(--sw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#halo{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,226,165,.34) 0%,rgba(255,170,70,.14) 28%,rgba(110,80,255,.07) 48%,transparent 66%);opacity:0;transition:opacity 1.2s ease}
#aura{position:absolute;left:50%;top:50%;width:340%;aspect-ratio:1;margin:-170% 0 0 -170%;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,140,.16) 0deg 2.5deg,transparent 2.5deg 9deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);
  opacity:0;transition:opacity 1.4s ease;animation:spin 110s linear infinite}
#om{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:'Tiro Devanagari Sanskrit',serif;
  font-size:calc(var(--sw)*1.05);line-height:1;color:rgba(255,205,120,.07);text-shadow:0 0 6vmin rgba(255,180,80,.25);opacity:0;transition:opacity 1.6s ease;white-space:nowrap}
#medal{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 3px rgba(255,214,140,.85),0 0 0 9px rgba(255,190,90,.18),0 0 60px 10px rgba(255,180,80,.45);opacity:0;transition:opacity 1s ease}
#shrine.on #medal{opacity:1}
#shiva{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;opacity:0;
  -webkit-mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 86%,transparent 100%);transform:scale(.88) translateY(3%);filter:blur(14px) brightness(2.4);
  transition:opacity .9s ease,transform 1.5s cubic-bezier(.2,.8,.2,1),filter 1.2s ease}
#shrine.on #aura,#shrine.on #halo{opacity:1}
#shrine.on #om{opacity:1;animation:breathe 7s ease-in-out infinite}
#shrine.on #shiva{opacity:1;transform:none;filter:blur(0px) brightness(1)}
#bust{transform-box:fill-box;transform-origin:50% 100%;animation:breath 5s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.008)}}
#eyeFlare{position:absolute;left:48.6%;top:31.5%;width:22%;aspect-ratio:1;margin:-11% 0 0 -11%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,250,225,.95) 0%,rgba(255,190,90,.6) 22%,rgba(255,110,40,.18) 45%,transparent 66%);opacity:0;transform:scale(.2);transition:opacity 1s ease,transform 1.3s ease}
#shrine.eye #eyeFlare{opacity:1;transform:scale(1);animation:pulse 2.2s ease-in-out 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.8}}
#hood{transform-box:view-box;transform-origin:150px 402px;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-3.5deg)}}
#tongue{animation:tongue 1.7s steps(1) infinite}
@keyframes tongue{0%{opacity:0}70%{opacity:1}86%{opacity:0}}
.ganga{stroke-dasharray:22 6;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.05)}}

/* ---------- greeting ---------- */
#greet{position:absolute;left:0;right:0;z-index:5;text-align:center;pointer-events:none;padding:0 4vw;
  opacity:0;transform:translateY(12px);filter:blur(8px);transition:opacity .8s ease,transform .9s ease,filter .8s ease}
#greet.show{opacity:1;transform:none;filter:blur(0px)}
.gname{font:700 clamp(1.4rem,6.2vmin,4.6rem)/1.2 'Cinzel',serif;letter-spacing:.12em}
.gsub{margin-top:.5em;font-style:italic;font-size:clamp(1.05rem,2.9vmin,1.7rem);color:#f3e6cf;text-shadow:0 2px 14px rgba(0,0,0,.85)}

/* ---------- captions ---------- */
#cap{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 11vh);transform:translateX(-50%);
  width:min(94vw,1100px);text-align:center;z-index:7;pointer-events:none}
#cap .c-main,#cap .c-sub{opacity:0;transform:translateY(14px);filter:blur(8px);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .55s ease}
#cap .c-sub{transition-delay:.2s}
#cap.show .c-main,#cap.show .c-sub{opacity:1;transform:none;filter:blur(0px)}
.c-main{font:600 clamp(1.6rem,5.6vmin,3.9rem)/1.2 'Cinzel',serif;letter-spacing:.06em}
.c-main.dev{font-family:'Tiro Devanagari Sanskrit',serif;letter-spacing:.02em;font-size:clamp(1.9rem,6.4vmin,4.4rem)}
.c-sub{margin-top:.4em;font-style:italic;font-size:clamp(1.05rem,2.9vmin,1.75rem);line-height:1.4;color:#f1e6d2;text-shadow:0 2px 12px rgba(0,0,0,.9);padding:0 2vw}

/* ---------- diyas ---------- */
#diyas{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 1.6vh);display:flex;justify-content:space-evenly;align-items:flex-end;z-index:6;pointer-events:none}
.diya{position:relative;width:clamp(28px,5.2vmin,70px);height:clamp(12px,2.2vmin,30px);background:linear-gradient(180deg,#d8772c,#8a3510 70%,#5a200a);
  border-radius:6% 6% 50% 50%/10% 10% 100% 100%;box-shadow:0 0 24px 4px rgba(255,140,50,.32),inset 0 3px 0 rgba(255,214,150,.55)}
.flame{position:absolute;left:50%;bottom:62%;width:34%;height:150%;transform-origin:50% 100%;transform:translateX(-50%);
  background:radial-gradient(ellipse 50% 60% at 50% 70%,#fffbe8 0%,#ffe08a 28%,#ff9a2e 58%,rgba(255,90,20,0) 72%);
  border-radius:50% 50% 45% 45%/65% 65% 35% 35%;animation:flick .12s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px rgba(255,170,60,.9))}
@keyframes flick{from{transform:translateX(-50%) scale(1,1) rotate(-2.5deg)}to{transform:translateX(-50%) scale(.9,1.1) rotate(2.5deg)}}

#flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 36%,#ffffff 0%,#fff1d0 32%,rgba(255,214,160,.35) 62%,rgba(255,200,140,0) 85%)}

/* ---------- ending ---------- */
#end{position:fixed;left:0;right:0;bottom:0;z-index:8;text-align:center;padding:10vh 5vw calc(env(safe-area-inset-bottom,0px) + 8vh);
  background:linear-gradient(to top,rgba(3,4,13,.94),rgba(3,4,13,.6) 55%,rgba(3,4,13,0));opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s}
#end.show{opacity:1;visibility:visible}
.e-title{font:400 clamp(2.8rem,11vmin,7rem)/1.05 'Great Vibes',cursive}
.e-name{margin-top:.1em;font:600 clamp(1.1rem,3.8vmin,2rem)/1.3 'Cinzel',serif;letter-spacing:.18em;color:#fff3d6}
.e-line{margin:.5em auto 0;max-width:34em;font-family:'Tiro Devanagari Sanskrit',serif;font-size:clamp(1.05rem,2.8vmin,1.5rem);color:var(--muted)}
.btn{margin-top:1em;font:700 .95rem/1 'Cinzel',serif;letter-spacing:.12em;color:#2a1604;background:linear-gradient(180deg,#fff1c1,#ffd27a 45%,#e09a35);
  border:0;border-radius:999px;padding:.95em 1.8em;cursor:pointer;box-shadow:0 10px 30px rgba(224,154,53,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,#mute:focus-visible,#soundHint:focus-visible{outline:2px solid #fff3cf;outline-offset:3px}
.e-end{margin-top:1.2em;font:400 .9rem/1 'Cinzel',serif;letter-spacing:.5em;color:rgba(255,226,170,.6)}

#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:11;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);color:var(--gold);font-size:19px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#soundHint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%);z-index:11;
  font:600 .85rem/1 'Cinzel',serif;letter-spacing:.08em;color:#ffe7b0;background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:.75em 1.2em;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .6s ease,visibility .6s}
#soundHint.gone{opacity:0;visibility:hidden}

@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-7px,3px)}20%{transform:translate(6px,-4px)}30%{transform:translate(-5px,-2px)}
  40%{transform:translate(4px,4px)}50%{transform:translate(-3px,2px)}60%{transform:translate(3px,-3px)}70%{transform:translate(-2px,1px)}80%{transform:translate(2px,-1px)}90%{transform:translate(-1px,1px)}}
.shake{animation:shake .8s ease-out}
@media (prefers-reduced-motion: reduce){ .shake{animation:none} #aura{animation:none} }
</style>
</head>

<script>

const NAME = "AMMULU (Sushma)";
/* ========================================================= */

(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const hexCache={};
function hex(h){ if(hexCache[h]) return hexCache[h]; const s=h.replace('#',''); return hexCache[h]=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; }
function mix(a,b,t){ const A=hex(a),B=hex(b); return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`; }
function mixA(a,b,t,al){ const A=hex(a),B=hex(b); return `rgba(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)},${al})`; }
function lerpAngle(a,b,t){ let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI; return a+d*t; }
const NAME_TXT=(String(NAME||'').trim()||'Dear Friend').slice(0,32);

/* ---------------- sound (synthesised, no files) ---------------- */
const Snd={ac:null,out:null,nb:null,muted:false,droneNodes:[],droneMaster:null,
  init(){
    if(this.ac) return;
    try{
      const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      const ac=new A(); this.ac=ac;
      const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(ac.destination);
      this.out=ac.createGain(); this.out.gain.value=.85; this.out.connect(comp);
      const len=ac.sampleRate*2, b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.nb=b;
    }catch(e){ this.ac=null; }
  },
  get ok(){ return !!this.ac&&this.ac.state==='running'; },
  setMuted(m){ this.muted=m; if(this.ac) this.out.gain.setTargetAtTime(m?0:.85,this.ac.currentTime,.05); },
  noise(t,dur,o={}){
    const a=this.ac, {type='lowpass',f0=1000,f1=80,q=.7,v=.5,att=.008,rate=1}=o;

function drawSky(dt,T){
  const c=bc;
  S.dim+=(S.dimT-S.dim)*Math.min(1,dt/700);

  g.addColorStop(0,mix('#03040d','#010108',d)); g.addColorStop(.55,mix('#0a0d26','#05061a',d)); g.addColorStop(1,mix('#24123a','#140a26',d));

  hr.addColorStop(0,`rgba(255,150,60,${.22*(1-d*.5)})`); hr.addColorStop(1,'rgba(255,150,60,0)');
  c.fillStyle=hr; c.fillRect(0,0,W,H);
  c.fillStyle='#fff';
  for(const s of stars){

    if(s.r>1.05){ c.beginPath(); c.arc(s.x,s.y,s.r,0,6.283); c.fill(); c.globalAlpha=a*.35;
      c.fillRect(s.x-s.r*3,s.y-.35,s.r*6,.7); c.fillRect(s.x-.35,s.y-s.r*3,.7,s.r*6); }
    else c.fillRect(s.x-s.r/2,s.y-s.r/2,s.r,s.r);

    L.y-=L.v*dt; if(L.y<-.08){ L.y=rand(1.05,1.25); L.x=Math.random(); }
    const x=L.x*W+Math.sin(T*.0004+L.ph)*24*u, y=L.y*H, s=L.s*u;
    const gl=c.createRadialGradient(x,y,0,x,y,34*s); gl.addColorStop(0,'rgba(255,170,70,.45)'); gl.addColorStop(1,'rgba(255,120,40,0)');
    c.fillStyle=gl; c.fillRect(x-34*s,y-34*s,68*s,68*s);
    const lg=c.createLinearGradient(0,y-9*s,0,y+9*s); lg.addColorStop(0,'#ffcf7a'); lg.addColorStop(1,'#e2622a');
    c.fillStyle=lg; c.beginPath(); c.moveTo(x-6*s,y-9*s); c.lineTo(x+6*s,y-9*s); c.lineTo(x+4.5*s,y+8*s); c.quadraticCurveTo(x,y+10*s,x-4.5*s,y+8*s); c.closePath(); c.fill();
    c.fillStyle='rgba(255,250,220,.9)'; c.beginPath(); c.arc(x,y+6*s,1.6*s,0,6.283); c.fill();

  if(S.glow>.01){
    const cx=S.gx,cy=S.gy, r=c.createRadialGradient(cx,cy,0,cx,cy,M*.95);
    r.addColorStop(0,`rgba(255,200,110,${.3*S.glow})`); r.addColorStop(.35,`rgba(255,140,60,${.12*S.glow})`);
    r.addColorStop(.7,`rgba(90,60,200,${.1*S.glow})`); r.addColorStop(1,'rgba(0,0,0,0)');

  }
}

/* ---------------- fireworks ---------------- */
const PALETTES=[['#ffd27a','#ffb347','#fff3cf'],['#ff5e8a','#ffb3c8','#ffffff'],['#62e6ff','#a8b8ff','#ffffff'],
  ['#b98bff','#f2a8ff','#ffffff'],['#7dffa6','#dcffb8','#ffffff'],['#ff7a3d','#ffd27a','#fff1d6'],['#ffffff','#ffe9b0','#ffd27a']];
const TYPES=['peony','peony','chrys','ring','willow','palm','crackle'];

class Spark{
  constructor(x,y,vx,vy,o){ this.x=this.px=x; this.y=this.py=y; this.vx=vx; this.vy=vy; this.life=this.max=o.life||60;
    this.color=o.color||'#fff'; this.size=o.size||1.6; this.grav=o.grav??.035; this.drag=o.drag??.98; this.flicker=o.flicker||0; }
  update(k){ this.px=this.x; this.py=this.y; const d=Math.pow(this.drag,k); this.vx*=d; this.vy=this.vy*d+this.grav*k; this.x+=this.vx*k; this.y+=this.vy*k; this.life-=k; }
  draw(c){ let a=this.life/this.max; if(this.flicker&&Math.random()<this.flicker) a*=.15;
    c.globalAlpha=a; c.strokeStyle=this.color; c.lineWidth=this.size*(.45+.75*a);
    c.beginPath(); c.moveTo(this.px,this.py); c.lineTo(this.x+.01,this.y); c.stroke(); }
}
class Rocket{
  constructor(x,ty,o={}){ this.x=this.px=x; this.y=this.py=H+10; this.big=!!o.big; const h=this.y-ty;
    this.g=this.big?2*h/(62*62):.06;
    this.vy=-Math.sqrt(2*this.g*h); this.vx=this.big?0:rand(-.5,.5);
    this.pal=o.pal||pick(PALETTES); this.type=o.type||pick(TYPES); this.dead=false; this.onExplode=null; }
  update(k){
    this.px=this.x; this.py=this.y; this.vy+=this.g*k; this.x+=this.vx*k; this.y+=this.vy*k;
    const n=this.big?4:1;
    for(let i=0;i<n;i++) if(sparks.length<7000) sparks.push(new Spark(this.x+rand(-1,1),this.y+rand(0,this.big?-this.vy*k:0),rand(-.35,.35),rand(.3,1.2),
      {color:this.big?pick(['#ffe2a8','#ffb347','#ffffff']):'#ffcf8a',life:rand(18,this.big?45:34),size:this.big?rand(1,2):rand(.6,1.3),grav:.03,drag:.95,flicker:.25}));
    if(this.vy>=-.4){ this.dead=true; explode(this.x,this.y,this); }
  }
  draw(c){ c.globalAlpha=1; c.strokeStyle=this.big?'#fff6dc':'#ffe6b8'; c.lineWidth=this.big?3.2:2;
    c.beginPath(); c.moveTo(this.px,this.py); c.lineTo(this.x,this.y+.01); c.stroke(); }
}
function sph(){ const u=Math.random()*2-1,t=Math.random()*6.2832,r=Math.sqrt(1-u*u); return [r*Math.cos(t),r*Math.sin(t)]; }
function glowAt(x,y,r,col){ const c=fc, g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  c.globalAlpha=.5; c.fillStyle=g; c.fillRect(x-r,y-r,r*2,r*2); c.globalAlpha=1; }
function explode(x,y,r){
  const u=U(), pal=r.pal, big=r.big;
  glowAt(x,y,(big?280:130)*u,pal[0]); S.flash=Math.min(1.2,S.flash+(big?1:.3));
  const sp=(big?8.5:rand(3.6,5.2))*u, P=(vx,vy,o)=>sparks.push(new Spark(x,y,vx,vy,o));
  switch(big?'peony':r.type){
    case 'ring':{ const n=90,tilt=rand(.25,1),rot=rand(0,Math.PI),cr=Math.cos(rot),sr=Math.sin(rot);
      for(let i=0;i<n;i++){ const a=i/n*6.2832, vx=Math.cos(a)*sp, vy=Math.sin(a)*sp*tilt; P(vx*cr-vy*sr,vx*sr+vy*cr,{color:pal[i%2],life:rand(65,90),size:1.9,drag:.975,grav:.028}); }
      for(let i=0;i<30;i++){ const [a,b]=sph(); P(a*sp*.35,b*sp*.35,{color:pal[2],life:rand(40,60),size:1.4,drag:.96}); } break; }
    case 'willow':{ for(let i=0;i<120;i++){ const [a,b]=sph(); P(a*sp*.9,b*sp*.9,{color:pick(['#ffc861','#ffdc95','#ffb347']),life:rand(150,210),size:1.3,drag:.983,grav:.02,flicker:.08}); } break; }
    case 'palm':{ const arms=rand(7,11)|0, off=rand(0,6.28);
      for(let a=0;a<arms;a++){ const an=off+a/arms*6.2832; for(let j=0;j<16;j++){ const s=sp*rand(.5,1.08);
        P(Math.cos(an)*s+rand(-.15,.15),Math.sin(an)*s+rand(-.15,.15),{color:j%3?pal[0]:pal[2],life:rand(80,115),size:2,drag:.978,grav:.03}); } } break; }
    case 'crackle':{ for(let i=0;i<130;i++){ const [a,b]=sph(); P(a*sp*.85,b*sp*.85,{color:i%2?'#ffffff':pal[0],life:rand(50,85),size:1.5,drag:.972,grav:.03,flicker:.55}); } break; }
    case 'chrys':{ for(let i=0;i<140;i++){ const [a,b]=sph(); P(a*sp,b*sp,{color:i%3?pal[0]:pal[2],life:rand(75,105),size:1.7,drag:.978,grav:.03}); }
      for(let i=0;i<50;i++){ const [a,b]=sph(); P(a*sp*.45,b*sp*.45,{color:pal[1],life:rand(55,80),size:1.5,drag:.97,grav:.03}); } break; }
    default:{ const n=big?440:(rand(100,150)|0);
      for(let i=0;i<n;i++){ const [a,b]=sph(); P(a*sp,b*sp,{color:pick(pal),life:big?rand(110,160):rand(60,95),size:big?2.3:1.7,drag:.978,grav:big?.024:.032,flicker:Math.random()<.2?.3:0}); } }
  }
  if(!big) Snd.boom(rand(.16,.34));
  if(r.onExplode) r.onExplode(x,y);
}
function launchRandom(){

/* ---- the one cracker that writes the greeting ---- */
class TP{
  constructor(x,y,tx,ty,sz){ this.x=x; this.y=y; this.tx=tx; this.ty=ty; const a=rand(0,6.283),s=rand(3,11)*U();
    this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s; this.t=0; this.delay=rand(60,220);
    this.c=pick(['#fff4d0','#ffd27a','#ffc04d','#ffe9a8','#ffffff']); this.s=sz*rand(.75,1.25); this.a=1; this.free=false; this.ph=rand(0,6.3); }
  update(dt,k){
    this.t+=dt;
    if(this.free){ this.vy+=.035*k; const d=Math.pow(.985,k); this.vx*=d; this.x+=this.vx*k; this.y+=this.vy*k; this.a-=.01*k; return; }
    if(this.t<this.delay){ const d=Math.pow(.93,k); this.vx*=d; this.vy*=d; this.x+=this.vx*k; this.y+=this.vy*k; }
    else { const e=1-Math.pow(.84,k); this.x+=(this.tx-this.x)*e; this.y+=(this.ty-this.y)*e; }
  }
  draw(c,T){ const tw=.6+.4*Math.sin(T*.005+this.ph); c.globalAlpha=Math.max(0,this.a)*tw; c.fillStyle=this.c;
    c.beginPath(); c.arc(this.x,this.y,this.s,0,6.283); c.fill(); }
  release(){ this.free=true; this.vx=rand(-1.2,1.2); this.vy=rand(-2.2,.4); }
}
function textTargets(str,cy){
  const oc=document.createElement('canvas'); oc.width=Math.ceil(W); oc.height=Math.ceil(H);
  const c=oc.getContext('2d',{willReadFrequently:true});
  let fs=Math.min(W*.17,H*.2,210); const font=s=>`${s}px "Great Vibes", "Segoe Script", cursive`;
  c.font=font(fs); while(c.measureText(str).width>W*.9&&fs>20){ fs*=.94; c.font=font(fs); }
  c.textAlign='center'; c.textBaseline='middle'; c.fillStyle='#fff'; c.fillText(str,W/2,cy);
  const d=c.getImageData(0,0,oc.width,oc.height).data, step=Math.max(2,Math.round(fs/42)), pts=[];
  for(let y=0;y<oc.height;y+=step) for(let x=0;x<oc.width;x+=step) if(d[(y*oc.width+x)*4+3]>130) pts.push([x+rand(-.6,.6),y+rand(-.6,.6)]);
  for(let i=pts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pts[i],pts[j]]=[pts[j],pts[i]]; }
  return {pts:pts.slice(0,3200),fs,step};
}
function bigBlast(x,y){
  Snd.boom(1,true); flashEl(.55,1100); S.flash=1.2;
  for(let i=0;i<120;i++){ const a=i/120*6.2832, s=9*U(); sparks.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,{color:'#fff4d6',life:rand(50,70),size:2,drag:.965,grav:.02})); }
  for(let i=0;i<260;i++){ const [a,b]=sph(), s=rand(5,7)*U(); sparks.push(new Spark(x,y,a*s,b*s,{color:pick(['#ffc861','#ffdf9e','#ffb347']),life:rand(150,220),size:1.4,drag:.982,grav:.02,flicker:.12})); }
  const ty=H*.3, {pts,fs,step}=textTargets('Happy Diwali',ty), sz=Math.max(.9,step*.42);
  for(const p of pts) tps.push(new TP(x,y,p[0],p[1],sz));
  const gr=$('#greet'); gr.style.top=(ty+fs*.6)+'px';
  setTimeout(()=>gr.classList.add('show'),450);
}

function stepFx(k,dt,T){
  const c=fc;
  c.globalCompositeOperation='destination-out'; c.globalAlpha=1; c.fillStyle=`rgba(0,0,0,${1-Math.pow(.8,k)})`; c.fillRect(0,0,W,H);
  c.globalCompositeOperation='lighter'; c.lineCap='round';
  if(S.auto&&Math.random()<S.rate*dt/1000) launchRandom();
  if(S.god&&Math.random()<.6*k) ember();
  for(let i=rockets.length-1;i>=0;i--){ const r=rockets[i]; r.update(k); r.draw(c); if(r.dead) rockets.splice(i,1); }
  let j=0;
  for(let i=0;i<sparks.length;i++){ const p=sparks[i]; p.update(k); if(p.life>0&&p.y<H+60&&p.y>-300){ p.draw(c); sparks[j++]=p; } }
  sparks.length=j;
  if(tps.length){ let m=0; for(let i=0;i<tps.length;i++){ const p=tps[i]; p.update(dt,k); if(p.a>0&&p.y<H+20){ p.draw(c,T); tps[m++]=p; } } tps.length=m; }
  c.globalAlpha=1; c.globalCompositeOperation='source-over';
}

function drawHead(c,x,y,ang,th,hood,cols,T){
  c.save(); c.translate(x,y); c.rotate(ang);
  const hw=th*1.05*hood, hl=th*(1.2+.5*hood);
  c.shadowColor=cols.glowS; c.shadowBlur=th*1.2;
  c.fillStyle=cols.out; c.beginPath(); c.moveTo(th*.7,0);
  c.bezierCurveTo(th*.5,-hw*1.08,-hl*.95,-hw*1.08,-hl*1.05,0); c.bezierCurveTo(-hl*.95,hw*1.08,th*.5,hw*1.08,th*.7,0); c.fill();
  c.shadowBlur=0;
  c.fillStyle=cols.body; c.beginPath(); c.moveTo(th*.62,0);
  c.bezierCurveTo(th*.45,-hw,-hl*.9,-hw,-hl,0); c.bezierCurveTo(-hl*.9,hw,th*.45,hw,th*.62,0); c.fill();
  c.strokeStyle=cols.pat; c.lineWidth=Math.max(1,th*.09);
  c.beginPath(); c.ellipse(-hl*.35,-hw*.42,hw*.2,hw*.16,0,0,6.283); c.stroke();
  c.beginPath(); c.ellipse(-hl*.35,hw*.42,hw*.2,hw*.16,0,0,6.283); c.stroke();
  c.beginPath(); c.moveTo(-hl*.35,-hw*.26); c.quadraticCurveTo(-hl*.1,0,-hl*.35,hw*.26); c.stroke();
  c.fillStyle=cols.out; c.beginPath(); c.ellipse(th*.85,0,th*.95,th*.62,0,0,6.283); c.fill();
  c.fillStyle=cols.body; c.beginPath(); c.ellipse(th*.85,0,th*.85,th*.54,0,0,6.283); c.fill();
  c.fillStyle=cols.hl; c.beginPath(); c.ellipse(th*.95,0,th*.5,th*.18,0,0,6.283); c.fill();
  c.shadowColor='#ff3030'; c.shadowBlur=th*.8; c.fillStyle='#ff4a3a';
  for(const s of [-1,1]){ c.beginPath(); c.arc(th*1.15,s*th*.3,th*.11,0,6.283); c.fill(); }
  c.shadowBlur=0;
  if(Math.sin(T*.014)>.5){ c.strokeStyle='#ff4d6d'; c.lineWidth=Math.max(1,th*.07); c.beginPath();
    c.moveTo(th*1.7,0); c.lineTo(th*2.3,0); c.lineTo(th*2.55,-th*.16); c.moveTo(th*2.3,0); c.lineTo(th*2.55,th*.16); c.stroke(); }
  c.restore();
}
const snake={on:false,t:0,dur:2000,settle:0,gold:0,goldT:0,pts:[],len:0,
  build(){
    const G=ringGeom(); this.cx=G.cx; this.cy=G.cy; this.R=G.R; this.th=Math.max(7,G.R*.075);
    const {cx,cy,R}=this, pts=[], yb=cy+R, amp=Math.min(H*.08,R*.3), wl=Math.max(200,R*1.25), x0=-R*1.4-40;
    for(let x=x0;x<cx;x+=2){ const env=clamp((cx-x)/(R*1.5),0,1); pts.push([x,yb-amp*Math.sin((x-cx)/wl*Math.PI*2)*env*env]); }
    const st=2/R; for(let a=Math.PI/2;a>=Math.PI/2-3*Math.PI;a-=st) pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);
    this.pts=pts; this.len=Math.round(Math.PI*2*R*.93/2);
  },
  start(){ this.build(); this.on=true; this.t0=performance.now(); this.settle=0; this.gold=0; this.goldT=0; },
  draw(dt,T){
    const c=sc; c.clearRect(0,0,W,H); if(!this.on) return;
    this.t=performance.now()-this.t0;
    const N=this.pts.length, u=Math.min(1,this.t/this.dur), e=1-Math.pow(1-u,1.35);
    const hi=Math.max(1,Math.floor(e*(N-1))), ti=Math.max(0,hi-this.len);
    if(u>=1) this.settle=Math.min(1,(this.t-this.dur)/450);
    this.gold+=(this.goldT-this.gold)*Math.min(1,dt/500);
    const th=this.th, g=this.gold, P=[];
    for(let i=ti;i<=hi;i++){
      const p=this.pts[i], q=this.pts[Math.min(N-1,i+1)], o=this.pts[Math.max(0,i-1)];
      let nx=-(q[1]-o[1]), ny=q[0]-o[0]; const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
      const w=Math.sin((hi-i)*.055+T*.008)*th*.35*(1-this.settle*.85)*Math.min(1,(hi-i)/40);
      P.push([p[0]+nx*w,p[1]+ny*w]);
    }
    const Mn=P.length; if(Mn<2) return;
    const cols={out:mix('#021a10','#3a2006',g),body:mix('#0e6a45','#c08a2e',g),hl:mix('#3cb47f','#f3d58c',g),pat:mix('#e0c060','#fff6d0',g),
      glow:mixA('#46ffaa','#ffc85a',g,.16),glowS:mixA('#46ffaa','#ffc85a',g,.9)};
    const prof=v=>v<.8?.16+.84*Math.pow(Math.sin(v/.8*Math.PI/2),.75):1-.28*(v-.8)/.2;
    c.lineCap='round'; c.lineJoin='round';
    c.strokeStyle=cols.glow; c.beginPath(); c.moveTo(P[0][0],P[0][1]); for(let i=1;i<Mn;i++) c.lineTo(P[i][0],P[i][1]);
    c.lineWidth=th*3.4; c.globalAlpha=.6+g*.4; c.stroke(); c.lineWidth=th*2; c.stroke(); c.globalAlpha=1;
    const CH=5, layer=(wf,col,dx=0,dy=0)=>{ c.strokeStyle=col;
      for(let s=0;s<Mn-1;s+=CH){ const e2=Math.min(Mn-1,s+CH); c.lineWidth=th*prof((s+e2)/2/(Mn-1))*wf;
        c.beginPath(); c.moveTo(P[s][0]+dx,P[s][1]+dy); for(let i=s+1;i<=e2;i++) c.lineTo(P[i][0]+dx,P[i][1]+dy); c.stroke(); } };
    layer(1.18,cols.out); layer(1,cols.body); layer(.36,cols.hl,-th*.1,-th*.14);
    const gap=Math.max(6,Math.round(th*.55)); c.fillStyle=cols.pat;
    for(let i=Mn-1-gap;i>gap;i-=gap){ const f=prof(i/(Mn-1)); if(f<.3) continue;
      const p=P[i],q=P[i+1], a=Math.atan2(q[1]-p[1],q[0]-p[0]), s=th*f*.24;
      c.save(); c.translate(p[0],p[1]); c.rotate(a); c.beginPath(); c.moveTo(s*1.4,0); c.lineTo(0,s); c.lineTo(-s*1.4,0); c.lineTo(0,-s); c.closePath(); c.fill(); c.restore(); }
    if(Math.random()<.45+g*.5){ const p=P[(Math.random()*Mn)|0];
      sparks.push(new Spark(p[0],p[1],rand(-.4,.4),rand(-.8,-.1),{color:g>.5?'#ffe7a3':'#9dffcf',life:rand(30,60),size:rand(.6,1.3),grav:-.005,drag:.97})); }
    const hp=P[Mn-1], hq=P[Math.max(0,Mn-7)], a=Math.atan2(hp[1]-hq[1],hp[0]-hq[0]);
    const st=ease(this.settle), ang=lerpAngle(a,-Math.PI/2,st), lift=th*2.4*st, hx=hp[0], hy=hp[1]-lift;
    if(st>0){ c.strokeStyle=cols.out; c.lineWidth=th*.98; c.beginPath(); c.moveTo(hp[0],hp[1]); c.lineTo(hx,hy); c.stroke();
      c.strokeStyle=cols.body; c.lineWidth=th*.8; c.stroke(); }
    drawHead(c,hx,hy,ang,th*.95,1+st*1.3,cols,T);
  }
};

/* ---------------- layout ---------------- */
function resize(){
  W=innerWidth; H=innerHeight; M=Math.min(W,H);
  DPR=Math.min(window.devicePixelRatio||1,3); while(W*H*DPR*DPR>12e6&&DPR>1) DPR-=.25;
  for(const c of [bg,fx,sn]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); }
  for(const c of [bc,fc,sc]) c.setTransform(DPR,0,0,DPR,0,0);
  makeStars(); if(snake.on) snake.build();
  if(S.god){ const G=ringGeom(); S.gx=G.cx; S.gy=G.cy; }
}
window.addEventListener('resize',resize);
resize();


(function buildDiyas(){
  const wrap=$('#diyas'), n=innerWidth<640?7:11;
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='diya'; const f=document.createElement('span'); f.className='flame';
    f.style.animationDuration=rand(.09,.17).toFixed(2)+'s'; f.style.animationDelay=(-Math.random()).toFixed(2)+'s'; d.appendChild(f); wrap.appendChild(d); }
})();

let last=performance.now();
function loop(T){ const dt=Math.min(48,T-last); last=T; const k=dt/16.667;
  drawSky(dt,T); stepFx(k,dt,T); snake.draw(dt,T); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* ---------------- sound unlock (browsers need one tap) ---------------- */
const hint=$('#soundHint'), muteBtn=$('#mute');
let soundOn=false;
function onSound(){ if(soundOn) return; soundOn=true; hint.classList.add('gone'); muteBtn.textContent='🔊'; muteBtn.setAttribute('aria-label','Mute sound'); if(S.god) Snd.drone(); }
function unlock(){ Snd.init(); if(!Snd.ac) return; if(Snd.ac.state==='running') onSound(); else Snd.ac.resume().then(()=>{ if(Snd.ac.state==='running') onSound(); }).catch(()=>{}); }
Snd.init(); if(Snd.ac){ Snd.ac.onstatechange=()=>{ if(Snd.ac.state==='running') onSound(); }; if(Snd.ac.state==='running') onSound(); }
window.addEventListener('pointerdown',e=>{ if(!e.target.closest('#mute')) unlock(); });
window.addEventListener('keydown',unlock);
muteBtn.addEventListener('click',()=>{ if(!soundOn){ unlock(); return; }
  Snd.setMuted(!Snd.muted); muteBtn.textContent=Snd.muted?'🔇':'🔊'; muteBtn.setAttribute('aria-label',Snd.muted?'Turn sound on':'Mute sound'); });
setTimeout(()=>hint.classList.add('gone'),9000);

/* ---------------- the 10-second story ---------------- */
function flashEl(peak,dur){ const el=$('#flash'); if(el.animate) el.animate([{opacity:0},{opacity:peak,offset:.08},{opacity:0}],{duration:dur,easing:'ease-out'}); }
function shake(){ const st=$('#stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }
let capTok=0;
async function caption(main,sub,hold,dev=false){
  const el=$('#cap'), tok=++capTok; el.classList.remove('show'); await sleep(40); if(tok!==capTok) return;
  el.textContent='';
  const m=document.createElement('div'); m.className='c-main'+(dev?' dev':''); const sp=document.createElement('span'); sp.className='gt'; sp.textContent=main; m.appendChild(sp); el.appendChild(m);
  if(sub){ const s=document.createElement('div'); s.className='c-sub'; s.textContent=sub; el.appendChild(s); }
  void el.offsetWidth; el.classList.add('show');
  await sleep(hold); if(tok===capTok) el.classList.remove('show'); await sleep(420);
}

let running=false;
async function show(){
  running=true;
  $('#greetName').textContent=`✦ ${NAME_TXT} ✦`;
  $('#endName').textContent=NAME_TXT;
  S.auto=true; S.rate=1.4; S.avoid=false;
  await sleep(300);                                         // 0.3 s
  Snd.whistle(1.05);
  await new Promise(res=>{ const r=new Rocket(W/2,H*.3,{big:true,pal:PALETTES[0]}); r.onExplode=(x,y)=>{ bigBlast(x,y); res(); }; rockets.push(r); });
  S.avoid=true; S.rate=3.2; setTimeout(salvo,450); setTimeout(salvo,1500);
  await sleep(2500);                                        // ~3.9 s
  tps.forEach(p=>p.release()); $('#greet').classList.remove('show'); S.rate=.5; S.dimT=1;
  await sleep(200);
  S.auto=false; snake.start(); Snd.hiss(2.2);               // Vasuki: 2 s
  await sleep(snake.dur+300);                               // ~6.4 s
  snake.goldT=1; Snd.rumble(.9);
  await sleep(350);
  const G=ringGeom(); S.gx=G.cx; S.gy=G.cy;                 // Mahadev: ~6.8 s
  flashEl(1,1300); shake(); Snd.boom(1,true); Snd.drone(); setTimeout(()=>Snd.conch(),250);
  S.god=true; S.glowT=1; S.flash=1.2; $('#shrine').classList.add('on'); ringBurst(G.cx,G.cy);
  await caption('हर हर महादेव','Har Har Mahadev',1300,true);
  $('#shrine').classList.add('eye'); Snd.bell(); flashEl(.3,700); ringBurst(G.left+G.w*.486,G.top+G.h*.315,120);
  await caption('“I am with you.”',`${NAME_TXT}, in every darkness, I am your light.`,1800);
  S.auto=true; S.avoid=true; S.rate=1.4;                    // ~10.4 s
  $('#end').classList.add('show');
  running=false;
}
function reset(){
  capTok++; $('#end').classList.remove('show'); $('#shrine').classList.remove('on','eye'); $('#greet').classList.remove('show'); $('#cap').classList.remove('show');
  snake.on=false; S.god=false; S.dimT=0; S.glowT=0; S.avoid=false; tps.length=0; Snd.stopDrone();
}
$('#replay').addEventListener('click',async()=>{ if(running) return; reset(); await sleep(500); show(); });

(async()=>{ try{ if(document.fonts&&document.fonts.load) await Promise.race([document.fonts.load('160px "Great Vibes"'),sleep(900)]); }catch(e){} show(); })();
})();
</script>
